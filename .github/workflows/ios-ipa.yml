name: Build IPA
run-name: ${{ github.event_name == 'pull_request' && format('ipa for pr {0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ipa for {0} at {1}', github.ref_name, github.sha) }}

# The Android build is untouched: this workflow only adds an iOS one, so a push
# that changes nothing under ios/ does not pay for a macOS runner.
on:
  schedule:
    # Hourly while the guest build is being brought up, because it is the only way
    # to find out whether it works: it takes hours on the first run, minutes after
    # that, and nothing else in CI exercises it. Relax this back to a nightly once
    # a run has succeeded - it is here because a guest that is never built is
    # indistinguishable from a guest that does not work.
    - cron: "7 * * * *"
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      guest:
        description: Build the guest runtime too (hours, cached afterwards)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ipa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bumped when the guest image, the QEMU fork or the patches change, so a stale
  # cached guest is never what a build tests.
  GUEST_CACHE_VERSION: v1

jobs:
  core:
    name: AppleDeckCore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # ci-logs: so a failure in a fork, where nobody has the Actions log UI, is
    # still readable with a plain fetch. See the "publish the failure" step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The runner image already has the toolchain (Swift 6 on ubuntu-24.04).
      # Installing one on top would be a dependency that can be renamed or
      # deprecated; the version in use is printed so a failure says which.
      - name: Toolchain
        run: swift --version
      # The platform-independent half of the port runs anywhere Swift runs: the
      # session state machine, the preference schema, the guest command line,
      # the agent bridge's verbs, the library reader. Catching those on a Linux
      # runner is minutes instead of the ten a macOS queue costs.
      - name: swift test
        id: core-test
        # pipefail, because without it tee's exit status is the step's and this
        # step is green whatever swiftc says. It was: several builds "passed" with
        # compile errors in the tree, which is exactly the kind of green that
        # costs an afternoon.
        run: |
          set -o pipefail
          swift test --package-path ios/Packages/AppleDeckCore 2>&1 | tee /tmp/core-test.log

      # The agent bridge's other half: the CLI against a stand-in server that
      # answers the way AgentRoute does. Swift tests each side, and this tests the
      # contract between them - a renamed field or a drifted exit code shows up
      # here and nowhere else.
      - name: appledeckctl against a stub bridge
        run: python3 ios/scripts/tests/appledeckctl_test.py
      # A failure has to be legible from outside Actions. Logs need a signed-in
      # session to download, and this fork has no secrets to publish them any
      # other way, so the tail is written to the ci/logs branch through the
      # contents API and is then readable with a plain fetch at
      #   raw.githubusercontent.com/vcvkk/AppleDeck/ci/logs/core-test.log
      # which is what a contributor without an Apple account can use too.
      # Published with git rather than the contents API.
      #
      # The API needs the branch to exist and then the file's blob sha, and it
      # answers 422 when either is wrong - which is how four failures in a row
      # published nothing while the step reported success. git already knows how
      # to do all of it, and this sequence can be exercised without a token.
      - name: publish the failure
        if: failure() && steps.core-test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            echo "# AppleDeckCore: swift test failed"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -200 /tmp/core-test.log 2>/dev/null || echo "no log"
            echo '```'
          } > /tmp/core-report.md
          git config user.name "ci" || true
          git config user.email "ci@users.noreply.github.com" || true
          git fetch -q --force origin ci/logs:ci/logs 2>/dev/null || true
          git checkout -q -B ci/logs FETCH_HEAD 2>/dev/null || git checkout -q --orphan ci/logs
          # After the checkout, not before: checking out the branch restores its
          # tree, so a file written beforehand is replaced by the old one and the
          # commit has nothing to say. Found by running the sequence twice
          # against a scratch repository.
          mkdir -p ci-logs
          install -m644 /tmp/core-report.md ci-logs/core-test.log || true
          git add -f ci-logs/core-test.log
          git commit -q -m "core test log for $GITHUB_SHA" || true
          git push -q --force origin HEAD:refs/heads/ci/logs || \
            echo "could not publish core-test.log" >> "$GITHUB_STEP_SUMMARY"
          git checkout -q main 2>/dev/null || true
          exit 0

      - name: No vendored key material
        run: |
          set -euo pipefail
          keys=$(git ls-files ios/ | grep -iE '\.(p12|pfx|p8|mobileprovision|key)$' || true)
          if [ -n "$keys" ]; then
            echo "::error::a key is committed under ios/: $keys"
            exit 1
          fi

  ipa:
    name: Unsigned IPA
    needs: core
    runs-on: macos-15
    # Generous because the guest build shares this job when it runs: the first
    # QEMU build is a couple of hours and the runner must not kill it half way.
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The newest Xcode on the image, not the default one. The default tracks
      # whatever the image shipped with, and an app built against an older
      # SDK gets letterboxed by the newer iOS it is installed on: black bars top
      # and bottom, everything scaled up. That is not something the build should
      # be able to get wrong silently, so the version is chosen here and printed.
      - name: Newest Xcode
        run: |
          set -euo pipefail
          best=""
          best_version="0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            if [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best="$app"
              best_version="$version"
            fi
          done
          [ -n "$best" ] || { echo "no Xcode on this image" >&2; exit 1; }
          sudo xcode-select -s "$best"
          echo "DEVELOPER_DIR=$best" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios && xcodegen generate --quiet

      # Two caches, because they age differently: the QEMU build tree is worth
      # hours and changes only with the patch, while the guest image is 4 GB and
      # changes only when the runtime catalogue does.
      - name: Cache the emulator build tree
        id: qemu
        uses: actions/cache@v4
        with:
          path: ios/build/qemu-utl
          key: qemu-${{ env.GUEST_CACHE_VERSION }}-${{ hashFiles('ios/patches/**') }}
          restore-keys: qemu-${{ env.GUEST_CACHE_VERSION }}-

      - name: Cache the guest image
        id: guest
        uses: actions/cache@v4
        with:
          path: ios/build/guest/rootfs.img
          key: guest-${{ env.GUEST_CACHE_VERSION }}-${{ hashFiles('ios/scripts/build_guest_image.sh') }}
          restore-keys: guest-${{ env.GUEST_CACHE_VERSION }}-

      # Advisory only. The script installs and finds its own tools, because the
      # two facts about Homebrew - it installs successfully and puts the
      # filesystem tools in a sbin that is not on PATH - make a step that
      # installs them wrong in a way that looks like success.
      - name: Report on the host's tools
        if: ${{ github.event_name == 'schedule' || inputs.guest == true || contains(github.event.head_commit.message, 'guest build') }}
        run: |
          {
            echo "host: $(uname -a)"
            echo "brew: $(command -v brew || echo none)"
            brew --prefix 2>&1 || true
            echo "PATH=$PATH"
          } 2>&1 | tee /tmp/tools.log
          command -v mkfs.ext4 || ls "$(brew --prefix)/sbin" 2>/dev/null | head -20 || true

      - name: Build the guest runtime
        if: ${{ github.event_name == 'schedule' || inputs.guest == true || contains(github.event.head_commit.message, 'guest build') }}
        run: |
          # The image first: it is a download and a repack, and the emulator is
          # the long part. Failing fast on a missing kernel beats spending an hour
          # on QEMU to find out there is nothing to boot.
          #
          # tee'd and pipefail'd: without the flag a failure is masked by tee's
          # exit status, and without the log the published report says nothing at
          # all - which is exactly how the last one failed silently.
          set -o pipefail
          {
            ./ios/scripts/build_guest_image.sh
            ./ios/scripts/build_guest.sh
          } 2>&1 | tee /tmp/guest.log

      - name: Build and package
        # teed, because the script's own output is where a bundle validation
        # failure explains itself; without this the publish step below would
        # find an empty log and say nothing at all.
        # pipefail, or a script that fails is masked by tee's exit status and the
        # run goes green with no IPA in it - which is exactly what happened once.
        run: |
          set -o pipefail
          ./ios/scripts/package_ipa.sh "$PWD/AppleDeck.ipa" 2>&1 | tee /tmp/ipa.log

      - name: publish the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Ends in `exit 0` on purpose: this step exists to explain the failure
          # above it, and a hiccup while publishing must not turn a compile
          # error into a red step that says nothing.
          set -uo pipefail
          {
            echo "# Unsigned IPA: build failed"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## compiler"
            echo
            echo '```'
            grep -E 'error:|fatal error|error :' /tmp/appledeck_ipa/build.log 2>/dev/null \
              | sed 's#/Users/runner/work/AppleDeck/AppleDeck/##' \
              | awk '!seen[$0]++' || true
            echo '```'
            echo
            echo "## host tools"
            echo
            echo '```'
            cat /tmp/tools.log 2>/dev/null || echo "the tools step did not run"
            echo '```'
            echo
            echo "## guest build"
            echo
            echo '```'
            tail -100 /tmp/guest.log 2>/dev/null || echo "no guest log: the guest build did not run"
            echo '```'
            echo
            echo "## bundle validation and packaging"
            echo
            echo '```'
            grep -E 'MISSING|ERROR|missing|error' /tmp/ipa.log 2>/dev/null || true
            echo '```'
            echo
            echo "## last 40 lines of the packaging step"
            echo
            echo '```'
            tail -40 /tmp/ipa.log 2>/dev/null || true
            echo '```'
          } > /tmp/ios-report.md
          git config user.name "ci" || true
          git config user.email "ci@users.noreply.github.com" || true
          git fetch -q --force origin ci/logs:ci/logs 2>/dev/null || true
          git checkout -q -B ci/logs FETCH_HEAD 2>/dev/null || git checkout -q --orphan ci/logs
          # After the checkout, for the reason in the core job's publisher: a
          # checkout restores the branch's tree and would put the old log back.
          mkdir -p ci-logs
          install -m644 /tmp/ios-report.md ci-logs/ios-build.log || true
          git add -f ci-logs/ios-build.log
          git commit -q -m "ios build log for $GITHUB_SHA" || true
          git push -q --force origin HEAD:refs/heads/ci/logs || \
            echo "could not publish ios-build.log" >> "$GITHUB_STEP_SUMMARY"
          git checkout -q main 2>/dev/null || true
          exit 0

      - name: What this build is
        run: |
          {
            echo "### AppleDeck, unsigned IPA"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            if [ -f ios/build/guest/vmlinuz-virt ]; then
              echo
              echo "Guest runtime: **included** (TCG guest, DroidDeck's Linux runtime inside)."
            else
              echo
              echo "Guest runtime: **not included**. The app installs and runs, and says on the"
              echo "Home page why a session cannot start. Re-run this workflow with the"
              echo "\`guest\` input to build one."
            fi
            echo
            echo "Install with AltStore, SideStore, TrollStore or Sideloadly. Unsigned on"
            echo "purpose; see \`ios/README.md\` for why it cannot be signed here."
            echo
            echo "What this IPA was built with, which is what a report of \"it looks wrong\""
            echo "needs before anyone rebuilds it:"
            echo
            echo '```'
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            git rev-parse --short HEAD
            echo '```'
            echo
            echo "On the phone, Settings -> Build shows the same three things, plus whether"
            echo "the launch screen is in the bundle. Without a launch screen iOS runs an"
            echo "app in the old 320x480 mode: black bars, everything scaled up."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: AppleDeck-ipa
          path: AppleDeck.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          MARK="<!-- appledeck-ipa -->"
          case "${{ job.status }}" in
            success)
              {
                echo "$MARK"
                echo "### Build passed"
                echo
                echo "The \`AppleDeck-ipa\` artifact is [on this run]($RUN_URL): an unsigned IPA,"
                echo "ready for AltStore, SideStore or TrollStore."
              } > /tmp/ipa-report.md
              ;;
            *)
              {
                echo "$MARK"
                echo "### Build failed"
                echo
                echo "The compiler's errors ([full log]($RUN_URL)):"
                echo
                echo '```'
                grep -E "error:" /tmp/appledeck_ipa/build.log 2>/dev/null | awk '!seen[$0]++' | head -40 \
                  || echo "no build log; the failure was before xcodebuild"
                echo '```'
              } > /tmp/ipa-report.md
              ;;
          esac
          cat /tmp/ipa-report.md >> "$GITHUB_STEP_SUMMARY"
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1 || true)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@/tmp/ipa-report.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@/tmp/ipa-report.md >/dev/null
          fi
